# Build + test on every push to master and every PR.
#
# Postgres-backed test projects honour DOCKET_TEST_PG (see PostgresFixture):
# when set, they use that server instead of spinning a local cluster. Each
# such project gets its OWN database (docket_cp / docket_mcp), created on
# demand by EF Core's EnsureCreated, so the projects stay isolated regardless
# of scheduling. When a new test project is added, give it its own step —
# and its own database here if it touches Postgres.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Manual opt-in trigger for the token-spending real-harness E2E matrix below. It
  # is NOT part of the per-push/PR matrix — GitHub forbids referencing secrets in a
  # job-level `if:`, so gating the job on workflow_dispatch (rather than the secret)
  # is what keeps every ordinary push from ever spending API tokens.
  workflow_dispatch:
    inputs:
      codex_model:
        description: "Codex model slug for the real-codex tier (DOCKET_CODEX_MODEL)"
        required: false
        default: "gpt-5.3-codex"
      opencode_model:
        description: "OpenCode model for the real-opencode tier, provider/model (DOCKET_OPENCODE_MODEL)"
        required: false
        default: "anthropic/claude-haiku-4-5-20251001"
      grok_model:
        description: "Grok Build model slug for the real-grok tier (DOCKET_GROK_MODEL)"
        required: false
        default: "grok-4.6"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: docket
          POSTGRES_PASSWORD: docket
          POSTGRES_DB: docket
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docket"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      # TreatWarningsAsErrors is on (Directory.Build.props), so this gates on
      # compiler warnings too. Builds the whole solution, including the runner
      # test harness the runner tests spawn.
      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test - Docket.Core (pure engine)
        run: dotnet test tests/Docket.Core.Tests --no-build -c Release

      - name: Test - Docket.Contracts (wire vocabulary)
        run: dotnet test tests/Docket.Contracts.Tests --no-build -c Release

      # The bump bot's own logic (tools/Docket.HarnessBump): the semver compare, the
      # dist-tags.latest read, the pin rewrite below, and the one-open-PR rule that decides
      # whether to spend a real-harness dispatch at all. Pure and fast — it runs here, on every
      # push, precisely so those rules are never first exercised by a live 06:17 cron run against
      # real money. Some of its tests read THIS file and assert the three harness pins are still
      # present and parseable, and that the jobs its merge gate waits on still exist by name.
      - name: Test - Docket.HarnessBump (the CLI bump bot's own rules)
        run: dotnet test tests/Docket.HarnessBump.Tests --no-build -c Release

      - name: Test - Docket.Runner (process supervision + WebSocket channel)
        run: dotnet test tests/Docket.Runner.Tests --no-build -c Release

      - name: Test - Docket.ControlPlane (Postgres)
        run: dotnet test tests/Docket.ControlPlane.Tests --no-build -c Release
        env:
          DOCKET_TEST_PG: Host=localhost;Port=5432;Username=docket;Password=docket;Database=docket_cp

      - name: Test - Docket.Mcp (Postgres + MCP end-to-end)
        run: dotnet test tests/Docket.Mcp.Tests --no-build -c Release
        env:
          DOCKET_TEST_PG: Host=localhost;Port=5432;Username=docket;Password=docket;Database=docket_mcp

      # docket-meta: unit/saga (in-memory, 0-skip) + endpoint (WebApplicationFactory)
      # + the migration test (its own docket_meta database) + the Docker-gated E2E.
      # The E2E's SkippableFacts run here because ubuntu runners have a Docker daemon;
      # they publish + build the docket runtime images in-process and provision a real
      # instance. On a runner without Docker they skip cleanly.
      - name: Test - Docket.Meta (Postgres + Docker-gated provisioning E2E)
        run: dotnet test tests/Docket.Meta.Tests --no-build -c Release
        env:
          DOCKET_TEST_PG: Host=localhost;Port=5432;Username=docket;Password=docket;Database=docket_meta

      - name: Test - Docket.MultiMachine (Postgres, multi-machine collab)
        run: dotnet test tests/Docket.MultiMachine.Tests --no-build -c Release
        env:
          DOCKET_TEST_PG: Host=localhost;Port=5432;Username=docket;Password=docket;Database=docket_multimachine

  # ── spec §17.8 chaos suite ──────────────────────────────────────────────────────
  #
  # Its own job rather than another step in the matrix above, because it is the one
  # suite that SIGKILLs real processes: it spawns the real control plane, the real
  # docketd and real worker binaries as separate OS processes and kills them mid-task.
  # Isolating it means a chaos scenario that leaks a process or wedges cannot take the
  # ordinary unit/integration legs down with it, and its failures are unambiguous.
  #
  # ubuntu-only on purpose: the §10 restart sweep discovers strays through
  # /proc/<pid>/environ (ProcFsProcessInventory), and on Windows it is a documented
  # deferral (NullProcessInventory) that would make the scenarios assert nothing — the
  # tests skip themselves there rather than pass vacuously.
  #
  # Runtime is bounded by construction, not by hope: the plane's liveness windows and
  # docketd's heartbeat are configuration, so the scenarios shrink a 30-minute
  # no-progress ceiling to seconds instead of waiting real durations, and every wait
  # has a hard deadline that dumps process output and task state on expiry. The whole
  # suite runs in well under a minute; the job timeout is a backstop for a hang.
  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: docket
          POSTGRES_PASSWORD: docket
          POSTGRES_DB: docket
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docket"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      # The suite spawns four real binaries (Docket.Mcp, docketd, and the two worker
      # harnesses) resolved from their own bin directories, so build the solution —
      # the build-only ProjectReferences guarantee all four are present.
      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test - Docket.Chaos (spec §17.8 chaos scenarios)
        run: dotnet test tests/Docket.Chaos.Tests --no-build -c Release
        env:
          DOCKET_TEST_PG: Host=localhost;Port=5432;Username=docket;Password=docket;Database=docket_chaos

  # ── Opt-in real-harness multi-machine E2E ──────────────────────────────────
  #
  # Four cells, one job. Token-spending, so workflow_dispatch only (GitHub forbids
  # referencing secrets in a job-level `if:`, so the event gate is what keeps an
  # ordinary push from ever spending). Display names stay `real-<harness>-e2e` so
  # the bump bot's merge gate (`E2eVerifier.RealHarnessJobs`) still matches.
  # `fail-fast: false` — one red CLI must not cancel the other three.
  #
  # Each cell runs only its own trait (`Category=RealClaude` / RealCodex /
  # RealOpenCode / RealGrok) and has its own database, so one cell's ResetAsync
  # cannot truncate another's fleet. Codex and OpenCode also install claude: the
  # mixed-fleet facts need both binaries. That claude pin is ONE `run:` line
  # shared via `if:` — lockstep is structural.
  #
  # PINS, and the versions are findings. `latest` moved mid-day on 2026-08-13:
  # one run installed claude 2.1.229 and went 9/9, another installed 2.1.231 and
  # went 7/2 on identical test code. npm prints no version. Do not go back to
  # `latest`; the daily bump bot carries these pins forward on evidence.
  #   * claude-code 2.1.232 — the stopgap after 2.1.231 read "call the docket
  #     get_task tool" as a shell command. Prompt clarity (#150) is the durable fix.
  #   * @openai/codex 0.147.0 — rust-v0.147.0, the source citations and the green
  #     baseline. latest is the release line; 0.148.0-alpha.* sit under `alpha`.
  #   * opencode-ai 1.18.18 — green on dispatch 31740997672. npm, not the vendor
  #     installer (this repo runs no shell scripts). 0.0.0-dev-* have their own tags.
  #   * grok 1.0.3 via install.sh — no npm package, so the bump bot never rewrites
  #     this pin. The merge gate still waits on the cell.
  #
  # Models are dispatch inputs, not PRs: the catalogs are server-side (Codex 404'd
  # gpt-5.1-codex-mini then gpt-5.1-codex; OpenCode fetches too). Forks without
  # the matching secret skip cleanly.
  real-e2e:
    if: github.event_name == 'workflow_dispatch'
    name: real-${{ matrix.harness }}-e2e
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - harness: claude
            category: RealClaude
            db: docket_realclaude
          - harness: codex
            category: RealCodex
            db: docket_realcodex
          - harness: opencode
            category: RealOpenCode
            db: docket_realopencode
          - harness: grok
            category: RealGrok
            db: docket_realgrok
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: docket
          POSTGRES_PASSWORD: docket
          POSTGRES_DB: docket
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docket"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        if: matrix.harness != 'grok'
        with:
          node-version: 20

      # Mixed-fleet cells (codex, opencode) and the claude cell share this pin.
      # One line, so a bump rewrites every cell that needs claude.
      - name: Install claude CLI
        if: matrix.harness != 'grok'
        run: npm install -g @anthropic-ai/claude-code@2.1.232

      - name: Install codex CLI
        if: matrix.harness == 'codex'
        run: npm install -g @openai/codex@0.147.0

      - name: Install opencode CLI
        if: matrix.harness == 'opencode'
        run: npm install -g opencode-ai@1.18.18

      - name: Install grok CLI
        if: matrix.harness == 'grok'
        run: |
          curl -fsSL https://x.ai/cli/install.sh | bash -s 1.0.3
          echo "$HOME/.grok/bin" >> "$GITHUB_PATH"

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build tests/Docket.MultiMachine.Tests --no-restore -c Release

      # Only this cell's trait. Secrets for every vendor are present on every cell
      # — Category= is what stops one cell lighting up another class. Mixed-fleet
      # facts need ANTHROPIC_KEY in the codex/opencode cells.
      - name: Test - real ${{ matrix.harness }} multi-machine E2E
        run: dotnet test tests/Docket.MultiMachine.Tests --no-build -c Release --filter "Category=${{ matrix.category }}"
        env:
          DOCKET_TEST_PG: Host=localhost;Port=5432;Username=docket;Password=docket;Database=${{ matrix.db }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_KEY }}
          CODEX_API_KEY: ${{ secrets.OPENAI_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY || secrets.XAI_KEY }}
          DOCKET_CODEX_MODEL: ${{ inputs.codex_model || 'gpt-5.3-codex' }}
          DOCKET_OPENCODE_MODEL: ${{ inputs.opencode_model || 'anthropic/claude-haiku-4-5-20251001' }}
          DOCKET_GROK_MODEL: ${{ inputs.grok_model || 'grok-4.6' }}
