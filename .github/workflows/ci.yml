# Build + test on every push to master and every PR.
#
# Postgres-backed test projects honour LANDBRIDGE_TEST_PG (see PostgresFixture):
# when set, they use that server instead of spinning a local cluster. Each
# such project gets its OWN database (landbridge_cp / landbridge_mcp), created on
# demand by EF Core's EnsureCreated, so the projects stay isolated regardless
# of scheduling. When a new test project is added, give it its own step —
# and its own database here if it touches Postgres.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Manual opt-in trigger for the token-spending real-harness E2E matrix below. It
  # is NOT part of the per-push/PR matrix — GitHub forbids referencing secrets in a
  # job-level `if:`, so gating the job on workflow_dispatch (rather than the secret)
  # is what keeps every ordinary push from ever spending API tokens.
  workflow_dispatch:
    inputs:
      codex_model:
        description: "Codex model slug for the real-codex tier (LANDBRIDGE_CODEX_MODEL)"
        required: false
        default: "gpt-5.6-luna"
      opencode_model:
        description: "OpenCode model for the real-opencode tier, provider/model (LANDBRIDGE_OPENCODE_MODEL)"
        required: false
        default: "anthropic/claude-haiku-4-5-20251001"
      grok_model:
        description: "Grok Build model slug for the real-grok tier (LANDBRIDGE_GROK_MODEL)"
        required: false
        default: "grok-4.6"
      goose_model:
        description: "Goose model slug for the real-goose tier (GOOSE_MODEL)"
        required: false
        default: "claude-haiku-4-5-20251001"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: landbridge
          POSTGRES_PASSWORD: landbridge
          POSTGRES_DB: landbridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U landbridge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      # TreatWarningsAsErrors is on (Directory.Build.props), so this gates on
      # compiler warnings too. Builds the whole solution, including the runner
      # test harness the runner tests spawn.
      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test - Landbridge.Core (pure engine)
        run: dotnet test tests/Landbridge.Core.Tests --no-build -c Release

      - name: Test - Landbridge.Contracts (wire vocabulary)
        run: dotnet test tests/Landbridge.Contracts.Tests --no-build -c Release

      - name: Test - Landbridge.Classifier (argv allowlist + destroy-guard)
        run: dotnet test tests/Landbridge.Classifier.Tests --no-build -c Release

      # The bump bot's own logic (tools/Landbridge.HarnessBump): the semver compare, the
      # dist-tags.latest read, the pin rewrite below, and the one-open-PR rule that decides
      # whether to spend a real-harness dispatch at all. Pure and fast — it runs here, on every
      # push, precisely so those rules are never first exercised by a live 06:17 cron run against
      # real money. Some of its tests read THIS file and assert the three harness pins are still
      # present and parseable, and that the jobs its merge gate waits on still exist by name.
      - name: Test - Landbridge.HarnessBump (the CLI bump bot's own rules)
        run: dotnet test tests/Landbridge.HarnessBump.Tests --no-build -c Release

      - name: Test - Landbridge.Runner (process supervision + WebSocket channel)
        run: dotnet test tests/Landbridge.Runner.Tests --no-build -c Release

      - name: Test - Landbridge.ControlPlane (Postgres)
        run: dotnet test tests/Landbridge.ControlPlane.Tests --no-build -c Release
        env:
          LANDBRIDGE_TEST_PG: Host=localhost;Port=5432;Username=landbridge;Password=landbridge;Database=landbridge_cp

      - name: Test - Landbridge.Mcp (Postgres + MCP end-to-end)
        run: dotnet test tests/Landbridge.Mcp.Tests --no-build -c Release
        env:
          LANDBRIDGE_TEST_PG: Host=localhost;Port=5432;Username=landbridge;Password=landbridge;Database=landbridge_mcp

      # landbridge-meta: unit/saga (in-memory, 0-skip) + endpoint (WebApplicationFactory)
      # + the migration test (its own landbridge_meta database) + the Docker-gated E2E.
      # The E2E's SkippableFacts run here because ubuntu runners have a Docker daemon;
      # they publish + build the landbridge runtime images in-process and provision a real
      # instance. On a runner without Docker they skip cleanly.
      - name: Test - Landbridge.Meta (Postgres + Docker-gated provisioning E2E)
        run: dotnet test tests/Landbridge.Meta.Tests --no-build -c Release
        env:
          LANDBRIDGE_TEST_PG: Host=localhost;Port=5432;Username=landbridge;Password=landbridge;Database=landbridge_meta

      - name: Test - Landbridge.MultiMachine (Postgres, multi-machine collab)
        run: dotnet test tests/Landbridge.MultiMachine.Tests --no-build -c Release
        env:
          LANDBRIDGE_TEST_PG: Host=localhost;Port=5432;Username=landbridge;Password=landbridge;Database=landbridge_multimachine

  # ── spec §17.8 chaos suite ──────────────────────────────────────────────────────
  #
  # Its own job rather than another step in the matrix above, because it is the one
  # suite that SIGKILLs real processes: it spawns the real control plane, the real
  # landbridged and real worker binaries as separate OS processes and kills them mid-task.
  # Isolating it means a chaos scenario that leaks a process or wedges cannot take the
  # ordinary unit/integration legs down with it, and its failures are unambiguous.
  #
  # ubuntu-only on purpose: the §10 restart sweep discovers strays through
  # /proc/<pid>/environ (ProcFsProcessInventory), and on Windows it is a documented
  # deferral (NullProcessInventory) that would make the scenarios assert nothing — the
  # tests skip themselves there rather than pass vacuously.
  #
  # Runtime is bounded by construction, not by hope: the plane's liveness windows and
  # landbridged's heartbeat are configuration, so the scenarios shrink a 30-minute
  # no-progress ceiling to seconds instead of waiting real durations, and every wait
  # has a hard deadline that dumps process output and task state on expiry. The whole
  # suite runs in well under a minute; the job timeout is a backstop for a hang.
  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: landbridge
          POSTGRES_PASSWORD: landbridge
          POSTGRES_DB: landbridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U landbridge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      # The suite spawns four real binaries (Landbridge.Mcp, landbridged, and the two worker
      # harnesses) resolved from their own bin directories, so build the solution —
      # the build-only ProjectReferences guarantee all four are present.
      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test - Landbridge.Chaos (spec §17.8 chaos scenarios)
        run: dotnet test tests/Landbridge.Chaos.Tests --no-build -c Release
        env:
          LANDBRIDGE_TEST_PG: Host=localhost;Port=5432;Username=landbridge;Password=landbridge;Database=landbridge_chaos

  # ── Opt-in real-harness multi-machine E2E ──────────────────────────────────
  #
  # Five cells, one job. Token-spending, so workflow_dispatch only (GitHub forbids
  # referencing secrets in a job-level `if:`, so the event gate is what keeps an
  # ordinary push from ever spending). Display names stay `real-<harness>-e2e` so
  # the bump bot's merge gate (`E2eVerifier.RealHarnessJobs`) still matches.
  # `fail-fast: false` — one red CLI must not cancel the other four.
  #
  # Each cell runs only its own trait (`Category=RealClaude` / RealCodex /
  # RealOpenCode / RealGrok / RealGoose) and has its own database, so one cell's
  # ResetAsync cannot truncate another's fleet. Codex and OpenCode also install
  # claude: the mixed-fleet facts need both binaries. That claude pin is ONE
  # `run:` line shared via `if:` — lockstep is structural.
  #
  # PINS, and the versions are findings. `latest` moved mid-day on 2026-08-13:
  # one run installed claude 2.1.229 and went 9/9, another installed 2.1.231 and
  # went 7/2 on identical test code. npm prints no version. Do not go back to
  # `latest`; the daily bump bot carries these pins forward on evidence.
  #   * claude-code 2.1.232 — the stopgap after 2.1.231 read "call the landbridge
  #     get_session tool" as a shell command. Prompt clarity (#150) is the durable fix.
  #   * @openai/codex 0.147.0 — rust-v0.147.0, the source citations and the green
  #     baseline. latest is the release line; 0.148.0-alpha.* sit under `alpha`.
  #   * opencode-ai 1.18.18 — green on dispatch 31740997672. npm, not the vendor
  #     installer (this repo runs no shell scripts). 0.0.0-dev-* have their own tags.
  #   * grok 1.0.3 via install.sh — no npm package, so the bump bot never rewrites
  #     this pin. The merge gate still waits on the cell.
  #   * goose 1.46.0 via download_cli.sh + GOOSE_VERSION — also not npm. The
  #     RealGoose cell runs both the direct `goose acp` bar and the ACP-bridge
  #     facts. CONFIGURE=false: goose configure is interactive.
  #
  # Models are dispatch inputs, not PRs: the catalogs are server-side (an unpinned
  # Codex adapter default is not on this project's key; OpenCode fetches too).
  # Forks without the matching secret skip cleanly.
  real-e2e:
    if: github.event_name == 'workflow_dispatch'
    name: real-${{ matrix.harness }}-e2e
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - harness: claude
            category: RealClaude
            db: landbridge_realclaude
          - harness: codex
            category: RealCodex
            db: landbridge_realcodex
          - harness: opencode
            category: RealOpenCode
            db: landbridge_realopencode
          - harness: grok
            category: RealGrok
            db: landbridge_realgrok
          - harness: goose
            category: RealGoose
            db: landbridge_realgoose
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: landbridge
          POSTGRES_PASSWORD: landbridge
          POSTGRES_DB: landbridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U landbridge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        if: matrix.harness != 'grok' && matrix.harness != 'goose'
        with:
          node-version: 20

      # Mixed-fleet cells (codex, opencode) and the claude cell share this pin.
      # One line, so a bump rewrites every cell that needs claude.
      - name: Install claude CLI
        if: matrix.harness != 'grok' && matrix.harness != 'goose'
        run: npm install -g @anthropic-ai/claude-code@2.1.259

      # The ACP adapters. Claude and Codex have no native ACP server, so the shared
      # real-harness bar — which now builds its rigs on `protocol: acp` — spawns these
      # instead of the CLI directly. OpenCode, Grok and Goose need nothing extra:
      # their ACP entry point is a subcommand of the CLI (`opencode acp`,
      # `grok agent stdio`, `goose acp`).
      #
      # Pinned like the CLIs, and deliberately NOT registered with the bump bot
      # (HarnessPackages.All): an adapter is a second upstream between landbridged and the
      # model, and auto-bumping one out of step with its harness is exactly the kind of
      # break that would first surface as a paid run failing. Capability drift is what
      # tools/acp-probe is for.
      - name: Install claude ACP adapter
        if: matrix.harness != 'grok' && matrix.harness != 'goose'
        run: npm install -g @agentclientprotocol/claude-agent-acp@0.68.0

      - name: Install codex CLI
        if: matrix.harness == 'codex'
        run: npm install -g @openai/codex@0.153.0

      - name: Install codex ACP adapter
        if: matrix.harness == 'codex'
        run: npm install -g @agentclientprotocol/codex-acp@1.3.0

      - name: Install opencode CLI
        if: matrix.harness == 'opencode'
        run: npm install -g opencode-ai@1.18.27

      - name: Install grok CLI
        if: matrix.harness == 'grok'
        run: |
          curl -fsSL https://x.ai/cli/install.sh | bash -s 1.0.3
          echo "$HOME/.grok/bin" >> "$GITHUB_PATH"

      # Pin the release, not `stable`. CONFIGURE=false: the script would otherwise
      # try `goose configure` on a headless runner. The binary lands in
      # ~/.local/bin; the cell's GOOSE_PROVIDER / GOOSE_MODEL are job env.
      - name: Install goose CLI
        if: matrix.harness == 'goose'
        run: |
          curl -fsSL https://github.com/aaif-goose/goose/releases/download/v1.46.0/download_cli.sh \
            | CONFIGURE=false GOOSE_VERSION=v1.46.0 bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build tests/Landbridge.MultiMachine.Tests --no-restore -c Release

      # Only this cell's trait. Secrets for every vendor are present on every cell
      # — Category= is what stops one cell lighting up another class. Mixed-fleet
      # facts need ANTHROPIC_KEY in the codex/opencode cells.
      - name: Test - real ${{ matrix.harness }} multi-machine E2E
        run: dotnet test tests/Landbridge.MultiMachine.Tests --no-build -c Release --filter "Category=${{ matrix.category }}"
        env:
          LANDBRIDGE_TEST_PG: Host=localhost;Port=5432;Username=landbridge;Password=landbridge;Database=${{ matrix.db }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_KEY }}
          CODEX_API_KEY: ${{ secrets.OPENAI_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY || secrets.XAI_KEY }}
          LANDBRIDGE_CODEX_MODEL: ${{ inputs.codex_model || 'gpt-5.6-luna' }}
          LANDBRIDGE_OPENCODE_MODEL: ${{ inputs.opencode_model || 'anthropic/claude-haiku-4-5-20251001' }}
          LANDBRIDGE_GROK_MODEL: ${{ inputs.grok_model || 'grok-4.6' }}
          GROK_DEFAULT_MODEL: ${{ inputs.grok_model || 'grok-4.6' }}
          LANDBRIDGE_REAL_GOOSE: ${{ matrix.harness == 'goose' && '1' || '' }}
          GOOSE_PROVIDER: ${{ matrix.harness == 'goose' && 'anthropic' || '' }}
          GOOSE_MODEL: ${{ inputs.goose_model || 'claude-haiku-4-5-20251001' }}
