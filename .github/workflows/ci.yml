# Build + test on every push to master and every PR.
#
# Postgres-backed test projects honour DOCKET_TEST_PG (see PostgresFixture):
# when set, they use that server instead of spinning a local cluster. Each
# such project gets its OWN database (docket_cp / docket_mcp), created on
# demand by EF Core's EnsureCreated, so the projects stay isolated regardless
# of scheduling. When a new test project is added, give it its own step —
# and its own database here if it touches Postgres.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Manual opt-in trigger for the token-spending real-claude E2E job below. It is
  # NOT part of the per-push/PR matrix — GitHub forbids referencing secrets in a
  # job-level `if:`, so gating the job on workflow_dispatch (rather than the secret)
  # is what keeps every ordinary push from ever spending API tokens.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: docket
          POSTGRES_PASSWORD: docket
          POSTGRES_DB: docket
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docket"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      # TreatWarningsAsErrors is on (Directory.Build.props), so this gates on
      # compiler warnings too. Builds the whole solution, including the runner
      # test harness the runner tests spawn.
      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test - Docket.Core (pure engine)
        run: dotnet test tests/Docket.Core.Tests --no-build -c Release

      - name: Test - Docket.Contracts (wire vocabulary)
        run: dotnet test tests/Docket.Contracts.Tests --no-build -c Release

      - name: Test - Docket.Runner (process supervision + WebSocket channel)
        run: dotnet test tests/Docket.Runner.Tests --no-build -c Release

      - name: Test - Docket.ControlPlane (Postgres)
        run: dotnet test tests/Docket.ControlPlane.Tests --no-build -c Release
        env:
          DOCKET_TEST_PG: Host=localhost;Port=5432;Username=docket;Password=docket;Database=docket_cp

      - name: Test - Docket.Mcp (Postgres + MCP end-to-end)
        run: dotnet test tests/Docket.Mcp.Tests --no-build -c Release
        env:
          DOCKET_TEST_PG: Host=localhost;Port=5432;Username=docket;Password=docket;Database=docket_mcp

      # docket-meta: unit/saga (in-memory, 0-skip) + endpoint (WebApplicationFactory)
      # + the migration test (its own docket_meta database) + the Docker-gated E2E.
      # The E2E's SkippableFacts run here because ubuntu runners have a Docker daemon;
      # they publish + build the docket runtime images in-process and provision a real
      # instance. On a runner without Docker they skip cleanly.
      - name: Test - Docket.Meta (Postgres + Docker-gated provisioning E2E)
        run: dotnet test tests/Docket.Meta.Tests --no-build -c Release
        env:
          DOCKET_TEST_PG: Host=localhost;Port=5432;Username=docket;Password=docket;Database=docket_meta

      - name: Test - Docket.MultiMachine (Postgres, multi-machine collab)
        run: dotnet test tests/Docket.MultiMachine.Tests --no-build -c Release
        env:
          DOCKET_TEST_PG: Host=localhost;Port=5432;Username=docket;Password=docket;Database=docket_multimachine

  # ── spec §17.8 chaos suite ──────────────────────────────────────────────────────
  #
  # Its own job rather than another step in the matrix above, because it is the one
  # suite that SIGKILLs real processes: it spawns the real control plane, the real
  # docketd and real worker binaries as separate OS processes and kills them mid-task.
  # Isolating it means a chaos scenario that leaks a process or wedges cannot take the
  # ordinary unit/integration legs down with it, and its failures are unambiguous.
  #
  # ubuntu-only on purpose: the §10 restart sweep discovers strays through
  # /proc/<pid>/environ (ProcFsProcessInventory), and on Windows it is a documented
  # deferral (NullProcessInventory) that would make the scenarios assert nothing — the
  # tests skip themselves there rather than pass vacuously.
  #
  # Runtime is bounded by construction, not by hope: the plane's liveness windows and
  # docketd's heartbeat are configuration, so the scenarios shrink a 30-minute
  # no-progress ceiling to seconds instead of waiting real durations, and every wait
  # has a hard deadline that dumps process output and task state on expiry. The whole
  # suite runs in well under a minute; the job timeout is a backstop for a hang.
  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: docket
          POSTGRES_PASSWORD: docket
          POSTGRES_DB: docket
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docket"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      # The suite spawns four real binaries (Docket.Mcp, docketd, and the two worker
      # harnesses) resolved from their own bin directories, so build the solution —
      # the build-only ProjectReferences guarantee all four are present.
      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test - Docket.Chaos (spec §17.8 chaos scenarios)
        run: dotnet test tests/Docket.Chaos.Tests --no-build -c Release
        env:
          DOCKET_TEST_PG: Host=localhost;Port=5432;Username=docket;Password=docket;Database=docket_chaos

  # ── Opt-in real-claude multi-machine E2E (spec §8.3 real tier, task #57) ────────
  #
  # Spawns REAL `claude -p` workers across a two-machine fleet and drives a task —
  # and a two-machine handoff — to completion through the live plane + relay. This
  # spends Anthropic tokens, so it is DELIBERATELY isolated from the per-push matrix:
  #   * it runs ONLY on a manual workflow_dispatch (never push/PR), and
  #   * it runs ONLY the RealClaude trait (`--filter Category=RealClaude`).
  # If the ANTHROPIC_KEY repo secret is unset, the tests SKIP cleanly (SkippableFact),
  # so a dispatch without the secret still passes without spending anything. The
  # secret is mapped to ANTHROPIC_API_KEY, which the spawned claude inherits.
  real-claude-e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: docket
          POSTGRES_PASSWORD: docket
          POSTGRES_DB: docket
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docket"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The worker binary docketd spawns. Installed to PATH as `claude`; the test
      # resolves it via PATH (or DOCKET_CLAUDE_BIN) and skips if it is missing.
      - name: Install claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build tests/Docket.MultiMachine.Tests --no-restore -c Release

      # Only the real-claude trait — the scripted tier is already covered per-push.
      - name: Test - real claude -p multi-machine E2E
        run: dotnet test tests/Docket.MultiMachine.Tests --no-build -c Release --filter "Category=RealClaude"
        env:
          DOCKET_TEST_PG: Host=localhost;Port=5432;Username=docket;Password=docket;Database=docket_realclaude
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_KEY }}

  # The §10 BYO-harness tier: the same fleet driven by OpenAI's Codex CLI instead of
  # claude. Gated exactly like real-claude-e2e and for the same reasons — it spends
  # tokens, so it runs ONLY on a manual workflow_dispatch and ONLY the RealCodex trait.
  #
